    <text x="564" y="314" class="mono up" font-size="16" font-weight="800">LONG</text>
    <text x="1185" y="314" class="mono up" font-size="26" font-weight="800">+$72.03</text>
    <text x="1240" y="342" class="mono up" font-size="13">+1.05%</text>
    <g class="mono" font-size="13">
      <text x="364" y="360" class="muted">ENTRY</text><text x="364" y="383" class="text">64,217.95</text>
      <text x="506" y="360" class="muted">LAST</text><text x="506" y="383" class="text">64,892.40</text>
      <text x="648" y="360" class="muted">SL</text><text x="648" y="383" class="down">63,446.87</text>
      <text x="790" y="360" class="muted">TP2</text><text x="790" y="383" class="up">66,222.75</text>
      <text x="932" y="360" class="muted">REGIME</text><text x="932" y="383" class="text">TREND_UP</text>
      <text x="1074" y="360" class="muted">CONF</text><text x="1074" y="383" class="text">5.76</text>
    </g>
    <rect x="364" y="404" width="100" height="28" rx="7" class="danger"/><text x="384" y="423" class="mono down" font-size="12">Close 100%</text>
    <rect x="474" y="404" width="88" height="28" rx="7" class="button"/><text x="493" y="423" class="mono soft" font-size="12">Close 25%</text>
    <rect x="572" y="404" width="75" height="28" rx="7" class="button"/><text x="591" y="423" class="mono soft" font-size="12">Move SL</text>
    <rect x="657" y="404" width="94" height="28" rx="7" class="button"/><text x="673" y="423" class="mono soft" font-size="12">Break Even</text>
