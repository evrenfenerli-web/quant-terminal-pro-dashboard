<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Quantum Terminal Pro Trade Manager demo screenshot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090914"/>
      <stop offset="0.55" stop-color="#111424"/>
      <stop offset="1" stop-color="#170b24"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2135"/>
      <stop offset="1" stop-color="#121725"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b777ff"/>
      <stop offset="1" stop-color="#ff9f6e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <style>
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #8f98ad; }
      .text { fill: #f4f6fb; }
      .soft { fill: #c8cedd; }
      .up { fill: #57e39f; }
      .down { fill: #ff6f8e; }
      .warn { fill: #ffcf6e; }
      .line { stroke: #2a3148; stroke-width: 1; }
      .panel { fill: url(#panel); stroke: #2c344f; stroke-width: 1; }
      .button { fill: #202842; stroke: #3a4566; stroke-width: 1; }
      .danger { fill: #2b1624; stroke: #ff6f8e; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)"/>
  <circle cx="1120" cy="110" r="360" fill="#7d3cff" opacity="0.08"/>
  <circle cx="890" cy="820" r="440" fill="#ff7f50" opacity="0.055"/>

  <g filter="url(#shadow)">
    <rect x="52" y="48" width="1336" height="804" rx="18" fill="#0d1020" stroke="#2f3750"/>
  </g>

  <rect x="52" y="48" width="245" height="804" rx="18" fill="#111625"/>
  <rect x="296" y="48" width="1092" height="804" rx="18" fill="#0e1322"/>
  <line x1="296" y1="48" x2="296" y2="852" class="line"/>

  <text x="94" y="112" class="sans text" font-size="25" font-weight="800">QUANT</text>
  <text x="193" y="112" class="sans" font-size="25" font-weight="800" fill="#ff9f6e">PRO</text>
  <text x="94" y="143" class="mono muted" font-size="12">self-hosted risk console</text>

  <g class="sans" font-size="15" font-weight="700">
    <text x="96" y="218" class="soft">Overview</text>
    <text x="96" y="269" class="soft">Workspace</text>
    <rect x="78" y="304" width="176" height="42" rx="9" fill="#222a44" stroke="#7d3cff" opacity="0.9"/>
