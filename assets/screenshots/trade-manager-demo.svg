  <rect x="880" y="142" width="250" height="64" rx="10" class="panel"/>
  <rect x="1150" y="142" width="160" height="64" rx="10" class="panel"/>
  <text x="362" y="167" class="mono muted" font-size="12">POSITIONS</text>
  <text x="362" y="194" class="mono text" font-size="28" font-weight="800">3</text>
  <text x="632" y="167" class="mono muted" font-size="12">OPEN PNL</text>
  <text x="632" y="194" class="mono up" font-size="28" font-weight="800">+$89.60</text>
  <text x="902" y="167" class="mono muted" font-size="12">OPEN RISK</text>
  <text x="902" y="194" class="mono text" font-size="28" font-weight="800">$310.42</text>
  <text x="1172" y="167" class="mono muted" font-size="12">LONG / SHORT</text>
  <text x="1172" y="194" class="mono text" font-size="28" font-weight="800">2 / 1</text>

  <text x="340" y="252" class="mono muted" font-size="15" font-weight="700">OPEN POSITIONS</text>

