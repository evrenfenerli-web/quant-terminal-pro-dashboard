    <rect x="340" y="452" width="970" height="122" rx="12" class="panel"/>
    <text x="364" y="488" class="mono text" font-size="22" font-weight="800">ETH/USDT:USDT</text>
    <text x="564" y="488" class="mono down" font-size="16" font-weight="800">SHORT</text>
    <text x="1188" y="488" class="mono up" font-size="25" font-weight="800">+$61.92</text>
    <g class="mono" font-size="13">
      <text x="364" y="530" class="muted">ENTRY</text><text x="364" y="552" class="text">3,298.45</text>
      <text x="506" y="530" class="muted">LAST</text><text x="506" y="552" class="text">3,264.80</text>
      <text x="648" y="530" class="muted">SL</text><text x="648" y="552" class="down">3,348.90</text>
      <text x="790" y="530" class="muted">TP1</text><text x="790" y="552" class="up">3,220.20</text>
      <text x="932" y="530" class="muted">REGIME</text><text x="932" y="552" class="text">TREND_DOWN</text>
      <text x="1074" y="530" class="muted">RISK</text><text x="1074" y="552" class="text">NORMAL</text>
