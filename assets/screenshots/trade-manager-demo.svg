  <g>
    <rect x="340" y="594" width="970" height="112" rx="12" class="panel"/>
    <text x="364" y="630" class="mono text" font-size="22" font-weight="800">SOL/USDT:USDT</text>
    <text x="548" y="630" class="mono up" font-size="16" font-weight="800">LONG</text>
    <text x="1188" y="630" class="mono down" font-size="25" font-weight="800">-$44.22</text>
    <text x="364" y="672" class="mono warn" font-size="14" font-weight="800">WATCH</text>
    <text x="432" y="672" class="mono soft" font-size="14">Range regime detected; manual reduction may be appropriate.</text>
    <rect x="1044" y="654" width="120" height="28" rx="7" class="button"/><text x="1065" y="673" class="mono soft" font-size="12">Move SL</text>
    <rect x="1174" y="654" width="108" height="28" rx="7" class="danger"/><text x="1193" y="673" class="mono down" font-size="12">Emergency</text>
  </g>

  <text x="340" y="754" class="mono muted" font-size="15" font-weight="700">TRADE EVENT TIMELINE</text>
  <rect x="340" y="776" width="970" height="48" rx="10" class="panel"/>
  <text x="364" y="806" class="mono muted" font-size="13">11:30</text>
  <text x="430" y="806" class="mono text" font-size="13" font-weight="800">BTC/USDT:USDT</text>
  <text x="575" y="806" class="mono up" font-size="13">MANUAL_REVIEW</text>
  <text x="720" y="806" class="mono soft" font-size="13">Move SL candidate detected after TP1 banked.</text>
</svg>
