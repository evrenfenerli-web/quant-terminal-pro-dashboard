  <rect x="555" y="205" width="330" height="380" rx="18" class="p"/><text x="590" y="260" class="s t" font-size="25" font-weight="800">Adapter Files</text><text x="590" y="320" class="m g" font-size="15">positions_state.json</text><text x="590" y="360" class="m g" font-size="15">orders_state.json</text><text x="590" y="400" class="m g" font-size="15">decision_state.json</text><text x="590" y="440" class="m g" font-size="15">trade_events.jsonl</text><text x="590" y="500" class="m o" font-size="15">manual_actions.jsonl</text>
  <rect x="1000" y="245" width="330" height="300" rx="18" class="p"/><text x="1035" y="300" class="s t" font-size="25" font-weight="800">Dashboard</text><text x="1035" y="350" class="m u" font-size="16">Trade Manager</text><text x="1035" y="386" class="m u" font-size="16">Diagnostics</text><text x="1035" y="422" class="m u" font-size="16">Analytics</text><text x="1035" y="492" class="m g" font-size="16">queue, validate, log</text>
