<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Quantum Terminal Pro adapter contract demo">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080914"/><stop offset="1" stop-color="#171027"/></linearGradient><style>.s{font-family:Inter,Arial,sans-serif}.m{font-family:Consolas,monospace}.t{fill:#f5f7ff}.u{fill:#8f98ad}.g{fill:#56e39f}.o{fill:#ff9f6e}.p{fill:#151b2c;stroke:#303956}.b{fill:#202842;stroke:#3a4566}.arrow{stroke:#b777ff;stroke-width:5;fill:none;marker-end:url(#arr)}</style><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b777ff"/></marker></defs>
